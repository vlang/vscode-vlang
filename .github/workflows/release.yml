name: Release

# Tags are bare semver here -- 0.1.15, not v0.1.15 -- even though the release
# itself is named v0.1.15. Both spellings are matched so the convention can
# change without the workflow silently never firing; a trigger that never
# matches is invisible until someone wonders why no release appeared.
on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  # So the packaging steps can be exercised without pushing a tag, which is
  # otherwise the only way to find out whether this file is wrong.
  workflow_dispatch:

# Least privilege: nothing in this workflow runs with implicit token scopes.
# The release job below declares exactly what it uses (`contents: write`
# to attach the VSIX to the GitHub Release, `actions: read` to verify CI
# passed on the tagged SHA). In particular no `id-token: write` is granted
# anywhere here: publishing uses PATs (see below); a future switch to
# trusted publishing needs a separate minimal publish job.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # A release is written against the tag, so the job needs contents: write.
    # Everything else is read-only, and the checkout is the tagged tree: what
    # gets published is what CI already verified on that SHA.
    # No `id-token: write` here: this job runs `npm ci`, tests, build, and
    # packaging before publishing, so any of that code could request an OIDC
    # token. Publishing below uses PATs; a future switch to trusted
    # publishing (`vsce publish --oidc`) needs a separate minimal publish
    # job that only gets `id-token: write` and the built VSIX.
    permissions:
      contents: write
      # Read the CI workflow runs to refuse publishing a tag whose SHA never
      # passed CI (see the gate step below).
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tag matches package.json version
        # The tag may be `0.2.1` or `v0.2.1`; both must equal package.json.
        # Failing here beats publishing a VSIX whose embedded version
        # disagrees with the release tag.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          # A version with a hyphen suffix (e.g. 0.3.0-rc.1) is a pre-release
          # and must be marked as such on both registries; otherwise it would
          # be published as stable. The publish steps below expand $PRE_RELEASE.
          if [ "$pkg" != "${pkg%%-*}" ]; then
            echo "PRE_RELEASE=--pre-release" >> "$GITHUB_ENV"
          else
            echo "PRE_RELEASE=" >> "$GITHUB_ENV"
          fi
        if: startsWith(github.ref, 'refs/tags/')
      # A release is published only from a tree that passed, so the gates run
      # again here rather than being assumed from the earlier CI run.
      - name: Run tests
        run: npm test
      - name: Run grammar tests
        run: npm run test:grammar
      - name: Build
        run: npm run build
      - name: Package
        run: npm run package
      # Publishing is only meaningful from a tree CI verified: this workflow
      # runs its own unit/type/lint/grammar/build/package gates, but not the
      # extension-host matrix (VS Code integration tests on ubuntu/macos with
      # fixture and real VLS servers). A tag pushed on a SHA that never passed
      # CI must not publish, so refuse when the CI workflow has no successful
      # run for the tagged commit.
      - name: Require green CI on the tagged SHA
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          conclusion="$(gh run list --commit "$sha" --workflow 'CI' --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          if [ "$conclusion" != 'success' ]; then
            echo "No successful CI run for tag $GITHUB_REF_NAME ($sha); refusing to publish (got: '${conclusion:-none}')."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Tag pushes only: a manual `workflow_dispatch` from a branch must not
      # create a GitHub Release (or tag) from that branch. Dispatch stays a
      # packaging dry run -- it builds the VSIX locally and uploads nothing.
      - name: Attach the VSIX to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # The tag may arrive with no release yet (a maintainer pushed it), or
          # with one already created on GitHub by tagging a release. Both land
          # the same way: create if absent, then upload.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # workflow_dispatch stays a packaging dry run: nothing is attached or
      # published. Attaching and publishing happen only on a tag push. Both
      # publish steps are idempotent on re-runs (--skip-duplicate).
      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # --no-install runs the lockfile-pinned binary from `npm ci` and fails
        # instead of fetching code from the registry while the publish token is
        # in the environment.
        run: npx --no-install vsce publish --packagePath ./*.vsix --skip-duplicate $PRE_RELEASE
        env:
          # PAT with publish rights for the `vlanguage` publisher. A future
          # switch to trusted publishing (`vsce publish --oidc`) needs a
          # separate minimal job with `id-token: write`; do not grant it to
          # this job, which runs untrusted build code before publishing.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # Pinned via the `ovsx` devDependency: --no-install runs the
        # lockfile-installed binary and fails instead of installing the
        # latest ovsx from the registry while OVSX_PAT is in the environment.
        run: npx --no-install ovsx publish --packagePath ./*.vsix --skip-duplicate $PRE_RELEASE
        env:
          # Personal access token from https://open-vsx.org/user-settings/tokens
          # with publish rights for the `vlanguage` namespace.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
