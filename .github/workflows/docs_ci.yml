name: Docs CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel outdated PR runs; keep each master commit and manual run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        id: uses_checkout_v5
      - uses: actions/setup-node@v5
        id: uses_setup_node_v5
        if: ${{ !cancelled() && steps.uses_checkout_v5.outcome == 'success' }}
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        if: ${{ !cancelled() && steps.uses_setup_node_v5.outcome == 'success' }}
        run: npm ci
      - name: Check readme linting
        id: check_readme_linting
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: npm run lint:md
