name: CI

on: [push, pull_request]

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: VSCE package
        run: npm run package

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint

  grammar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v /tmp/v
          cd /tmp/v
          make
          sudo ./v symlink
      - name: Check grammar pattern references
        run: npm run test:grammar:check
      - name: Run grammar tests
        run: npm run test:grammar
