name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel outdated PR runs; keep each master commit and manual run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # The lock is the cache key, so every job that installs the same
          # dependencies shares one entry.
          cache: npm
      - name: Validate GitHub Actions workflows
        # The list is explicit, not a glob: this job now runs on Windows too, and a
        # glob is not expanded there, so `actionlint .github/workflows/*.yml` would
        # ask it to read a filename containing an asterisk. A new workflow file has
        # to be added here.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/docs_ci.yml
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: VSCE package
        run: npm run package

  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and Markdown
        run: npm run fmt:check && npm run lint:md

  grammar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run grammar tests
        run: npm run test:grammar

  extension-host:
    name: Extension host (${{ matrix.os }}, ${{ matrix.server }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        server: [fixture, real]
        exclude:
          # VLS is built from source with the pinned compiler. That bootstrap does
          # not run on Windows yet, so only the fixture server is covered there.
          - os: windows-latest
            server: real
    runs-on: ${{ matrix.os }}
    # Windows currently fails one restart case the other platforms do not
    # exercise. Report it without gating a merge until that is fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Toolchain cache
        id: v-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/v
          # The build is pure for a pinned source revision, so the key names both
          # pinned revisions: the other server variants then restore this build
          # instead of re-running it.
          key: v-toolchain-${{ runner.os }}-01eb66904707b68fca95091ba820672b2a2611eb-475a2bd7ec4bed7061721816afb46580c4fe0a5b
      - name: Build V compiler from the pinned source
        if: steps.v-toolchain.outputs.cache-hit != 'true' && matrix.os != 'windows-latest'
        shell: bash
        env:
          V1_FALLBACK_CACHE_DIR: ${{ runner.temp }}/v1-fallback
        run: |
          git init "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" fetch --depth 1 https://github.com/vlang/v.git 01eb66904707b68fca95091ba820672b2a2611eb
          git -C "$RUNNER_TEMP/v" checkout --detach FETCH_HEAD
          # Keep the bootstrap compatible with the pinned V source. A newer vc
          # can reject code that this compiler revision still accepts.
          git init "$RUNNER_TEMP/v/vc"
          git -C "$RUNNER_TEMP/v/vc" fetch --depth 1 https://github.com/vlang/vc.git 475a2bd7ec4bed7061721816afb46580c4fe0a5b
          git -C "$RUNNER_TEMP/v/vc" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/v" latest_tcc
          make -C "$RUNNER_TEMP/v" local=1
          make -C "$RUNNER_TEMP/v" v1
      - name: Fetch the official V release
        # There is no GNU make on the Windows runner, so V comes from the official
        # build of the same version the pinned source produces.
        if: steps.v-toolchain.outputs.cache-hit != 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        env:
          V_VERSION: "0.5.2"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'v_windows.zip'
          Invoke-WebRequest -Uri "https://github.com/vlang/v/releases/download/$env:V_VERSION/v_windows.zip" -OutFile $archive
          # The archive has a top-level v/ directory, so unpacking into RUNNER_TEMP
          # leaves the compiler at RUNNER_TEMP/v/v.exe, which is the path the test
          # step passes as V_BINARY and the path the toolchain cache keys on.
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          $v = Join-Path $env:RUNNER_TEMP 'v/v.exe'
          if (-not (Test-Path $v)) { throw "v.exe not found at $v" }
          Write-Host "V compiler: $v"
          & $v version
      - name: VLS toolchain cache
        if: matrix.server == 'real'
        id: vls-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vls
          # Keyed on the V revision the server is built with as well as its own,
          # because the compiler that produces it is part of what is cached.
          key: vls-toolchain-${{ runner.os }}-e61d428dc80453397f8d4a128f202b7c6be22fb0-01eb66904707b68fca95091ba820672b2a2611eb
      - name: Build VLS with version reporting
        if: matrix.server == 'real' && steps.vls-toolchain.outputs.cache-hit != 'true'
        env:
          V1_FALLBACK_CACHE_DIR: ${{ runner.temp }}/v1-fallback
        run: |
          git init "$RUNNER_TEMP/vls"
          # Pin the CLI version follow-up on top of current upstream VLS so the
          # real host exercises an external executable without managed metadata.
          git -C "$RUNNER_TEMP/vls" fetch --depth 1 https://github.com/tomaszbk/vls.git e61d428dc80453397f8d4a128f202b7c6be22fb0
          git -C "$RUNNER_TEMP/vls" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/vls"
          "$RUNNER_TEMP/v/v" -new-compiler .
          # Pin the CLI version follow-up on top of current upstream VLS so the
          # real host exercises an external executable without managed metadata.
          git -C "$RUNNER_TEMP/vls" fetch --depth 1 https://github.com/tomaszbk/vls.git e61d428dc80453397f8d4a128f202b7c6be22fb0
          git -C "$RUNNER_TEMP/vls" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/vls"
          "$RUNNER_TEMP/v/v" -new-compiler .
      - name: Run VS Code integration tests
        shell: bash
        env:
          V1_FALLBACK_CACHE_DIR: ${{ runner.temp }}/v1-fallback
          V_BINARY: ${{ matrix.os == 'windows-latest' && format('{0}/v/v.exe', runner.temp) || format('{0}/v/v', runner.temp) }}
          VLS_BINARY: ${{ matrix.server == 'real' && format('{0}/vls/vls', runner.temp) || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:vscode
          else
            npm run test:vscode
          fi
